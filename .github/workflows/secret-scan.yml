name: Secret Scan (PAT / token / private-key patterns)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  scan-secrets:
    name: Scan for leaked credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect GitHub classic PATs
        run: |
          echo "=== Scanning for GitHub classic PATs (ghp_, gho_, ghu_, ghs_, ghr_) ==="
          # Classic PATs are exactly 40 chars: prefix (4) + 36 alphanum
          if grep -rEn --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.sh' --include='*.ts' --include='*.js' \
               --include='*.tf' --include='*.env' \
               -e 'ghp_[A-Za-z0-9]{36}' \
               -e 'gho_[A-Za-z0-9]{36}' \
               -e 'ghu_[A-Za-z0-9]{36}' \
               -e 'ghs_[A-Za-z0-9]{36}' \
               -e 'ghr_[A-Za-z0-9]{36}' \
               . ; then
            echo "::error::Classic GitHub PAT pattern detected. Revoke at https://github.com/settings/tokens and remove from history."
            exit 1
          fi

      - name: Detect GitHub fine-grained PATs (github_pat_*)
        run: |
          echo "=== Scanning for fine-grained GitHub PATs ==="
          # Fine-grained PATs: github_pat_ + 82 chars
          if grep -rEn --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.sh' --include='*.ts' --include='*.js' \
               --include='*.tf' --include='*.env' \
               -e 'github_pat_[A-Za-z0-9_]{82}' \
               . ; then
            echo "::error::Fine-grained GitHub PAT pattern detected. Revoke at https://github.com/settings/personal-access-tokens and remove from history."
            exit 1
          fi

      - name: Detect LLM provider tokens (OpenAI / Anthropic / xAI / Google / Mistral)
        run: |
          echo "=== Scanning for LLM provider tokens ==="
          # Tighter: 40+ chars after prefix to avoid matching state-change event IDs like sk-state-change-tick103
          if grep -rEn --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.sh' --include='*.ts' --include='*.js' \
               --include='*.tf' --include='*.env' \
               -e '\bsk-[A-Za-z0-9]{40,}\b' \
               -e '\bsk-ant-[A-Za-z0-9_-]{40,}\b' \
               -e '\bsk-proj-[A-Za-z0-9_-]{40,}\b' \
               -e '\bxai-[A-Za-z0-9]{40,}\b' \
               -e '\bAIza[0-9A-Za-z_-]{35}\b' \
               . ; then
            echo "::error::LLM provider key detected. Rotate immediately."
            exit 1
          fi

      - name: Detect private key blocks
        run: |
          echo "=== Scanning for private key blocks ==="
          if grep -rEn --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.sh' --include='*.ts' --include='*.js' \
               --include='*.tf' --include='*.env' --include='*.pem' --include='*.key' \
               -e 'BEGIN RSA PRIVATE KEY' \
               -e 'BEGIN OPENSSH PRIVATE KEY' \
               -e 'BEGIN PRIVATE KEY' \
               -e 'BEGIN EC PRIVATE KEY' \
               -e 'BEGIN DSA PRIVATE KEY' \
               . ; then
            echo "::error::Private key block detected. Replace with secrets manager lookup."
            exit 1
          fi

      - name: Detect AWS / R2 / Supabase service keys
        run: |
          echo "=== Scanning for cloud provider keys ==="
          if grep -rEn --include='*.md' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.py' --include='*.sh' --include='*.ts' --include='*.js' \
               --include='*.tf' --include='*.env' \
               -e 'AKIA[0-9A-Z]{16}' \
               -e 'aws_secret_access_key' \
               -e 'supabase[_-]service[_-]role[_-]key' \
               . ; then
            echo "::error::Cloud service key detected. Rotate via provider dashboard."
            exit 1
          fi

      - name: Allowlist — known false positives
        run: |
          echo "=== No secret patterns found in tracked files ==="
          echo "To allowlist a known-safe string, add a 'grep -v' filter above."
          echo "Examples of false-positive patterns: 'sk-state-change-tick<N>' (state-change event IDs)"
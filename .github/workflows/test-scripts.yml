name: Test Scripts

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '0 4 * * *'  # Daily at 4am

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install pyyaml
      - name: Run tests
        run: |
          python -m unittest discover -s tests -t .

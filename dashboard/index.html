<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIW Admin Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 20px; }
h1 { color: #50e3c2; margin-bottom: 20px; }
h2 { color: #50e3c2; margin: 20px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
.card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; }
.card h3 { color: #50e3c2; margin-bottom: 10px; }
.metric { font-size: 2em; font-weight: bold; color: #50e3c2; }
.label { color: #888; font-size: 0.9em; margin-top: 5px; }
.status-good { color: #50e3c2; }
.status-warn { color: #f0c850; }
.status-bad { color: #e35050; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
th { color: #50e3c2; }
.refresh { position: fixed; top: 10px; right: 10px; background: #50e3c2; color: #0f0f0f; padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
</style>
</head>
<body>
<button class="refresh" onclick="location.reload()">Refresh</button>
<h1>🤖 AIW Admin Dashboard</h1>

<div class="grid" id="metrics">
<!-- Filled by JS -->
</div>

<h2>Department Status</h2>
<div class="grid" id="departments">
<!-- Filled by JS -->
</div>

<h2>Recent Activity</h2>
<div class="card">
<pre id="recent" style="font-size: 0.85em; max-height: 400px; overflow-y: auto;">
Loading...
</pre>
</div>

<script>
async function load() {
    try {
        const r = await fetch('/org-state.json');
        const data = await r.json();
        
        // Metrics
        const m = data.metrics || {};
        const eval_g = data.eval_gate || {};
        const cron = data.cron || {};
        const metrics = document.getElementById('metrics');
        const pass_rate = eval_g.pass_rate_pct || 0;
        const status = pass_rate >= 80 ? 'good' : pass_rate >= 60 ? 'warn' : 'bad';
        
        metrics.innerHTML = `
            <div class="card">
                <h3>Agents</h3>
                <div class="metric">${m.agents_total || 0}</div>
                <div class="label">${m.agents_with_briefs || 0} with briefs</div>
            </div>
            <div class="card">
                <h3>Briefs</h3>
                <div class="metric">${m.total_briefs || 0}</div>
                <div class="label">total produced</div>
            </div>
            <div class="card">
                <h3>Customers</h3>
                <div class="metric">${m.customers_total || 0}</div>
                <div class="label">${m.customers_onboarded || 0} onboarded</div>
            </div>
            <div class="card">
                <h3>Eval-Gate</h3>
                <div class="metric status-${status}">${pass_rate}%</div>
                <div class="label">${eval_g.all_pass || 0}/${eval_g.all_briefs_evaluated || 0} briefs</div>
            </div>
            <div class="card">
                <h3>Cron Jobs</h3>
                <div class="metric">${cron.total_jobs || 0}</div>
                <div class="label">${cron.live_active || 0} active</div>
            </div>
            <div class="card">
                <h3>Coaching</h3>
                <div class="metric">${m.coaching_pipeline || 0}</div>
                <div class="label">in pipeline</div>
            </div>
        `;
        
        // Departments (top 20 agents by recent brief)
        const agents = data.agents || {};
        const sorted = Object.entries(agents)
            .filter(([name, info]) => info.latest_brief)
            .sort((a, b) => (b[1].latest_brief?.modified || '').localeCompare(a[1].latest_brief?.modified || ''))
            .slice(0, 20);
        
        const dept = document.getElementById('departments');
        dept.innerHTML = sorted.map(([name, info]) => `
            <div class="card">
                <h3>${name}</h3>
                <div class="metric">${info.brief_count || 0}</div>
                <div class="label">last: ${info.latest_brief?.date || '—'}</div>
            </div>
        `).join('');
        
        // Recent activity
        document.getElementById('recent').textContent = JSON.stringify(data, null, 2).slice(0, 5000);
    } catch(e) {
        document.getElementById('recent').textContent = 'Error: ' + e.message;
    }
}
load();
setInterval(load, 60000); // Refresh every minute
</script>
</body>
</html>
